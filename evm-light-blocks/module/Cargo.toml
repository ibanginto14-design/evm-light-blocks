[package]
name = "evm-blocks-without-traces"
version = "0.1.0"
edition = "2021"
description = "Type-preserving light EVM blocks for Substreams: the same sf.ethereum.type.v2.Block with call traces and block-level state changes removed"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
buffa = "0.9.2"
substreams = "0.8.0"
substreams-ethereum = "0.12.0"

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
